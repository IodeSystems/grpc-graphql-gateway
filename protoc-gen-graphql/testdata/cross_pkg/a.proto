syntax = "proto3";

package crosspkga.v1;

import "graphql.proto";
import "cross_pkg/b.proto";

option go_package = "example.com/repo/gen/v1/a;v1";

// Reproduces the issue where two protos share the same trailing Go
// package name (`;v1`). The generator used to compare Go package
// names only, so a field referencing crosspkgb.v1.Test produced an
// unqualified `Gql__type_Test()` plus an unused import.
service A {
  rpc Index(IndexRequest) returns (IndexResponse) {
    option (graphql.schema) = {
      type: QUERY
      name: "index"
    };
  }
}

message IndexRequest {
  string q = 1;
}

message IndexResponse {
  repeated crosspkgb.v1.Test clusters = 1;
}
